# Publishes both packages when a v<major>.<minor>.<patch> tag is pushed, through npm's and PyPI's
# trusted publishing (OIDC): no registry tokens are stored, and both registries record provenance
# that names this workflow and commit. Both registries hold a "Trusted Publisher" entry for this
# repository, this file name and the `release` environment; the environment is the gate.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: The tag names a release version and the tagger is a maintainer
        env:
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(a[0-9]+|b[0-9]+|rc[0-9]+|\.post[0-9]+)?$ ]] || { echo "::error::$REF is not a release tag"; exit 1; }
          [[ "$ACTOR" == frontboat ]] || { echo "::error::$ACTOR may not release"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the version in both manifests
        env:
          REF: ${{ github.ref }}
        run: |
          tag="${REF#refs/tags/v}"
          npm_version=$(node -p 'require("./package.json").version')
          py_version=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml)
          [[ "$tag" == "$npm_version" && "$tag" == "$py_version" ]] || { echo "::error::tag $tag, package.json $npm_version, pyproject $py_version"; exit 1; }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - run: bunx tsc --noEmit -p .
      - run: bun test
      - run: bun run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and check the Python distributions
        run: |
          python -m pip install -q build twine
          python -m build python --outdir python/dist
          twine check python/dist/*
      - name: The wheel runs the README examples
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q python/dist/*.whl
          "$RUNNER_TEMP/venv/bin/python" test/readme_examples.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: dist/
      # Node 24 bundles an npm new enough for trusted publishing (11.5.1 or later); provenance is
      # recorded automatically. --ignore-scripts keeps `prepare` from rebuilding what `build` tested.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm publish --access public --ignore-scripts
