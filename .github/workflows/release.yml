# Publishes both packages when a v<major>.<minor>.<patch> tag is pushed, through npm's and PyPI's
# trusted publishing (OIDC): no registry tokens are stored, and both registries record provenance
# that names this workflow and commit. Both registries hold a "Trusted Publisher" entry for this
# repository, this file name and the `release` environment. Configure independent approval
# and tag restrictions on that environment; workflow checks alone do not stop account takeover.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # Verify CI results for the release commit.
    steps:
      - name: The tag names a release version and the tagger is a maintainer
        env:
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(a[0-9]+|b[0-9]+|rc[0-9]+|\.post[0-9]+)?$ ]] || { echo "::error::$REF is not a release tag"; exit 1; }
          [[ "$ACTOR" == frontboat ]] || { echo "::error::$ACTOR may not release"; exit 1; }
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a main commit with successful macOS CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          [[ "$commit" == "$RELEASE_SHA" ]] || { echo "::error::Checkout differs from the release commit"; exit 1; }
          git merge-base --is-ancestor "$commit" origin/main || { echo "::error::Release commit is not on main"; exit 1; }
          # Query the exact commit, workflow, branch and push event; a green PR run is insufficient.
          passed=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f head_sha="$commit" -f branch=main -f event=push -f status=success \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          [[ "$passed" -gt 0 ]] || { echo "::error::Release commit needs successful push CI on main"; exit 1; }
      - name: The tag matches the version in both manifests
        env:
          REF: ${{ github.ref }}
        run: |
          tag="${REF#refs/tags/v}"
          npm_version=$(node -p 'require("./package.json").version')
          py_version=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml)
          [[ "$tag" == "$npm_version" && "$tag" == "$py_version" ]] || { echo "::error::tag $tag, package.json $npm_version, pyproject $py_version"; exit 1; }
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          no-cache: true
      # Build once below; installation must not trigger the prepare build.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check-generated
      - run: bun run check-parity
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun run test/npm-distribution.ts
        env:
          NPM_DIST_DIR: ${{ runner.temp }}/npm-dist
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Build and check the Python distributions
        run: |
          python -m pip install -q build twine
          python -m build python --outdir python/dist
          twine check python/dist/*
          python test/python_distribution.py python/dist/*.whl python/dist/*.tar.gz
      - name: The wheel runs the README examples
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q python/dist/*.whl
          "$RUNNER_TEMP/venv/bin/python" test/readme_examples.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-dist
          path: ${{ runner.temp }}/npm-dist/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  pypi:
    name: pypi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write # Registry trusted publishing; no project code runs in this job.
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  npm:
    name: npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write # Registry trusted publishing; no project code runs in this job.
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-dist
          path: npm-dist/
      # Publish the tested tarball without checking out or executing project code.
      # Node 24 bundles an npm new enough for OIDC trusted publishing.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish the tested archive
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(npm-dist/*.tgz)
          [[ "${#archives[@]}" -eq 1 ]] || { echo "::error::Expected exactly one npm archive"; exit 1; }
          npm publish "${archives[0]}" --access public --ignore-scripts
