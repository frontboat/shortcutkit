name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - run: bunx tsc --noEmit -p .
      - run: bun test
      - run: bun run build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Import from Node and write a shortcut
        run: |
          cd "$RUNNER_TEMP"
          node --input-type=module -e '
            import { Shortcut, actions, ACTIONS } from "'"$GITHUB_WORKSPACE"'/dist/index.js";
            const s = new Shortcut("Node");
            s.action(actions.showresult, { Text: "hi" });
            const p = await s.write();
            console.log(process.version, Object.keys(ACTIONS).length, "actions, wrote", p);
          '
          head -c 6 Node.shortcut | grep -q bplist
      - name: Python package
        run: |
          cd python
          python3 -m venv .venv && .venv/bin/pip install -q -e .
          .venv/bin/python -c "from shortcutkit import ACTIONS; assert len(ACTIONS) > 300"
      - name: Build and sign a shortcut
        run: bun run demo "$RUNNER_TEMP/CI Demo.shortcut" && head -c 4 "$RUNNER_TEMP/CI Demo.shortcut" | grep -q AEA1
