name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - run: bunx tsc --noEmit -p .
      - run: bun test
      - run: bun run build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Import from Node and write a shortcut
        run: |
          cd "$RUNNER_TEMP"
          node --input-type=module -e '
            import { Shortcut, actions, ACTIONS } from "'"$GITHUB_WORKSPACE"'/dist/index.js";
            const s = new Shortcut("Node");
            s.action(actions.showresult, { Text: "hi" });
            const p = await s.write();
            console.log(process.version, Object.keys(ACTIONS).length, "actions, wrote", p);
          '
          head -c 6 Node.shortcut | grep -q bplist
      - name: Python package
        run: |
          cd python
          python3 -m venv .venv && .venv/bin/pip install -q -e .
          .venv/bin/python -c "from shortcutkit import ACTIONS; assert len(ACTIONS) > 1800 and sum(1 for a in ACTIONS.values() if 'descriptor' in a) > 1400"
      # Filter Contacts builds its sort-property state through the Contacts framework, which waits
      # forever for a privacy answer on a runner that was never asked. Record "denied" (as on the
      # extraction Mac) for the processes the image attributes requests to.
      - name: Answer the Contacts privacy prompt in advance
        run: |
          for c in /opt/hca/hosted-compute-agent /usr/local/opt/runner/provisioner/provisioner /bin/bash /usr/bin/osascript; do
            sudo sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "insert or replace into access (service, client, client_type, auth_value, auth_reason, auth_version, flags) values ('kTCCServiceAddressBook', '$c', 1, 0, 4, 1, 0)"
          done
          pkill -x -U "$(id -u)" tccd || true
      # When the runner's Shortcuts is older than the data's, keys its engine does not define or hides
      # are reported as version gaps, not failures (verify-library-output.js); everything else fails.
      - name: Validate everything the library writes against the engine
        timeout-minutes: 5
        run: |
          sw_vers; defaults read /System/Applications/Shortcuts.app/Contents/Info.plist CFBundleShortVersionString
          open -a Shortcuts && sleep 15 && pkill -x Shortcuts || true
          PYTHON="$GITHUB_WORKSPACE/python/.venv/bin/python" VERIFY_TRACE=1 bun run verify
      - name: Build the demo shortcut with Bun (unsigned; shortcuts sign needs an iCloud login)
        run: |
          cd "$RUNNER_TEMP"
          bun -e '
            import { Shortcut, actions, ref, text } from "'"$GITHUB_WORKSPACE"'/src/index.ts";
            const s = new Shortcut("CI Demo", { color: "Teal" });
            s.action(actions.setstoredcontent, { WFInput: "hello from ci", WFStoredContentKey: "demo", WFStoredContentGlobalValue: false });
            const got = s.action(actions.getstoredcontent, { WFStoredContentKey: "demo" });
            const gid = s.if(ref(got), "has_any_value");
            s.action(actions.showresult, { Text: text("Stored value: ", ref(got)) });
            s.otherwise(gid);
            s.action(actions.showresult, { Text: text("Nothing stored") });
            s.endIf(gid);
            console.log("wrote", await s.write(), s.actions.length, "actions");
          '
          head -c 6 "CI Demo.shortcut" | grep -q bplist
